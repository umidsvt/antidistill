# Setup 1 seed run (scripts/30_setup1_queue.sh): limo, seed 44; otherwise identical to qwen2.5-1.5b_limo.yaml.
# E1 (results/m8_audit_design.md §6-7): Qwen2.5-1.5B student on LIMO (U).
# Identical to qwen2.5-7b_limo.yaml (LIMO's default recipe) except: model, dataset, output_dir;
# 2 GPUs with gradient_accumulation_steps 4, so the global batch stays 8 (2 x 1 x 4) and the run is
# still 1,500 steps; save_strategy "no" (only the final model is needed; training is unchanged).
# Launch: GPUS=6,7 scripts/20_train.sh configs/train/qwen2.5-1.5b_limo.yaml
model_name_or_path: Qwen/Qwen2.5-1.5B

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/deepspeed/ds_z3_config.json
flash_attn: fa2

# DEVIATION (antidistill) — required to fit on 46GB L40S; not in the LIMO default.
# Without it ZeRO-3 OOMs at step 2: 38.2GB steady + a 9.28GB allocation for the fp32
# cross-entropy upcast over Qwen's 152k vocab at seq 16384 = 47.5GB vs 44.4GB capacity.
# (PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True was tried first and cut fragmentation
# from 7-10GB to ~200MB, but the shortfall is real, not fragmentation.)
# Liger's fused linear cross-entropy never materialises the [seq, vocab] logits tensor,
# removing that allocation outright. It is a fused kernel computing the same loss, so the
# deviation is numerical-precision-level only — and it speeds training up rather than
# slowing it, unlike optimizer offload. liger-kernel==0.5.10 (>=0.6 requires transformers
# >=4.52, which LLaMA-Factory 0.9.2 forbids).
enable_liger_kernel: true

### dataset
dataset: limo_v2
dataset_dir: data
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 64
template: qwen

### output
output_dir: saves/Qwen2.5-1.5B_limo_s44
logging_steps: 1
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 15
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
seed: 44
