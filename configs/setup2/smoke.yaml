# Smoke test only: tiny splits, 1 epoch.
artifacts:
  save_full_text_traces: false
  save_inspection_samples: 4
  save_prompt_dictionary: true
data:
  dataset_name: gsm8k
  holdout_size: 24
  materialize_splits: true
  test_size: 48
  train_size: 48
distill:
  beta_s_values:
  - 0.5
  gradient_accumulation_steps: 4
  holdout_grad_batch_size: 6
  lora_alpha: 128
  lora_dropout: 0.0
  lora_r: 128
  lr: 5e-4
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_length: 2048
  num_epochs: 1
  penalty_transform: exp
  per_device_train_batch_size: 6
  save_final_model: false
  student_modes:
  - naive
  trace_weights_fd_batch_size: 12
  warmup_ratio: 0.03
  weight_decay: 0.1
generation:
  answer_force: true
  answer_force_max_new_tokens: 32
  answer_force_suffix: '


    **Final Answer**

    \[\boxed{'
  batch_size: 240
  eps: 0.01
  greedy: false
  max_new_tokens: 1024
  max_prompt_tokens: 512
  temperature: 0.6
  top_p: 0.95
model:
  attn_implementation: flash_attention_2
  proxy_student: Qwen/Qwen2.5-3B
  student: unsloth/Llama-3.2-3B
  student_tokenizer: unsloth/Llama-3.2-3B-Instruct
  teacher: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  tokenizer: null
  torch_dtype: bfloat16
run:
  output_dir: outputs/setup2
  run_name: smoke_s123
  save_config_snapshot: true
  seed: 123
teachers:
  antidistillation_lams: []
  poe_gammas: []
  standard: true
  strategic_beta_teachers: []
