# Setup 2, MATH variant (results/m8_audit_design.md §9.4): the MATH setup of ADS / PoE, run with the Distillation
# Game code. As its configs/math.yaml except: train 5000 and test 5000 (the sizes of its paper's Table 1; the repo
# config uses 2000/1000), holdout 64 (used only by ADS and the adaptive student), the 'standard' teacher on and
# ADS/PoE off, passive students only, the ungated unsloth copy of Llama-3.2-3B, and the output folder.
# Solo, level C: an open model of the teacher's size
artifacts:
  save_full_text_traces: false
  save_inspection_samples: 5
  save_prompt_dictionary: true
data:
  dataset_name: math
  holdout_size: 64
  materialize_splits: true
  test_size: 5000
  train_size: 5000
distill:
  beta_s_values:
  - 0.5
  gradient_accumulation_steps: 4
  holdout_grad_batch_size: 6
  lora_alpha: 128
  lora_dropout: 0.0
  lora_r: 128
  lr: 5e-4
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_length: 2048
  num_epochs: 3
  penalty_transform: exp
  per_device_train_batch_size: 6
  save_final_model: false
  student_modes:
  - naive
  trace_weights_fd_batch_size: 12
  warmup_ratio: 0.03
  weight_decay: 0.1
generation:
  answer_force: true
  answer_force_max_new_tokens: 32
  answer_force_suffix: '


    **Final Answer**

    \[\boxed{'
  batch_size: 64
  eps: 0.01
  greedy: false
  max_new_tokens: 1024
  max_prompt_tokens: 512
  temperature: 0.6
  top_p: 0.95
model:
  attn_implementation: flash_attention_2
  proxy_student: Qwen/Qwen2.5-3B
  student: unsloth/Llama-3.2-3B
  student_tokenizer: unsloth/Llama-3.2-3B-Instruct
  teacher: Qwen/Qwen2.5-7B-Instruct
  tokenizer: null
  torch_dtype: bfloat16
run:
  output_dir: outputs/setup2
  run_name: math_solo_q7i_s125
  save_config_snapshot: true
  seed: 125
teachers:
  antidistillation_lams: []
  poe_gammas: []
  standard: true
  strategic_beta_teachers: []
